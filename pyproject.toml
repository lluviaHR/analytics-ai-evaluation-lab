[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-ai-evaluation-lab"
version = "0.1.0"
description = "Reproducible evidence-centered AI analytics evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
